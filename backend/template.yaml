AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Serverless API for the research-agent application

Parameters:
  CorporaTableName:
    Type: String
    Default: research-agent-corpora
  ChunksTableName:
    Type: String
    Default: research-agent-chunks
  DocumentStatusTableName:
    Type: String
    Default: research-agent-document-status
  VectorIndexName:
    Type: String
    Default: embedding-index
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
  EmbeddingDimensions:
    Type: Number
    Default: 1024
  GenerationModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
  ProductionFrontendOrigin:
    Type: String
    Default: https://research-agent-iota.vercel.app
  DocumentUploadBucketName:
    Type: String
    Description: Existing private bucket for document uploads

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    MemorySize: 1024
    Timeout: 60
    Tracing: Active

Resources:
  DocumentIngestionFailures:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  DocumentIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: research-agent-document-ingestion
      CodeUri: .
      Handler: app.workers.document_ingestion_worker.handler
      Timeout: 300
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt DocumentIngestionFailures.Arn
      Environment:
        Variables:
          DOCUMENT_UPLOAD_BUCKET: !Ref DocumentUploadBucketName
          DYNAMODB_CORPORA_TABLE: !Ref CorporaTableName
          DYNAMODB_CHUNKS_TABLE: !Ref ChunksTableName
          DYNAMODB_DOCUMENT_STATUS_TABLE: !Ref DocumentStatusTableName
          BEDROCK_EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          BEDROCK_EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadUploadedFiles
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${DocumentUploadBucketName}/uploads/*
            - Sid: ReadCorpus
              Effect: Allow
              Action: dynamodb:GetItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CorporaTableName}
            - Sid: StoreDocumentChunks
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChunksTableName}
            - Sid: UpdateProcessingStatus
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentStatusTableName}
            - Sid: GenerateEmbeddings
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
            - Sid: SendFailedEvents
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt DocumentIngestionFailures.Arn

  AllowS3ToInvokeDocumentIngestion:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DocumentIngestionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${DocumentUploadBucketName}
      SourceAccount: !Ref AWS::AccountId

  ResearchAgentUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: research-agent-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Password-reset codes are delivered only to a user's verified email.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  ResearchAgentUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: research-agent-web
      UserPoolId: !Ref ResearchAgentUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ResearchAgentHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Limit sustained traffic and short spikes before requests reach Lambda.
      # Requests over these limits receive HTTP 429 responses.
      DefaultRouteSettings:
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 5
      # Permit the browser-based frontend to call this API from its own origin.
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
          - !Ref ProductionFrontendOrigin
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - DELETE
          - GET
          - POST
          - OPTIONS
      # API Gateway validates Cognito JWTs before protected requests reach Lambda.
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${ResearchAgentUserPool}
              audience:
                - !Ref ResearchAgentUserPoolClient

  ResearchAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: research-agent-api
      CodeUri: .
      Handler: app.main.handler
      Environment:
        Variables:
          DYNAMODB_CORPORA_TABLE: !Ref CorporaTableName
          DYNAMODB_CHUNKS_TABLE: !Ref ChunksTableName
          DYNAMODB_VECTOR_INDEX: !Ref VectorIndexName
          BEDROCK_EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
          BEDROCK_EMBEDDING_DIMENSIONS: !Ref EmbeddingDimensions
          BEDROCK_GENERATION_MODEL_ID: !Ref GenerationModelId
          DOCUMENT_UPLOAD_BUCKET: !Ref DocumentUploadBucketName
          DYNAMODB_DOCUMENT_STATUS_TABLE: !Ref DocumentStatusTableName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: ReadResearchAgentTables
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:SearchVectors
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CorporaTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChunksTableName}
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChunksTableName}/index/*
            - Sid: InvokeResearchModels
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.amazon.nova-2-lite-v1:0
            - Sid: UploadDocuments
              Effect: Allow
              Action:
                - s3:DeleteObject
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${DocumentUploadBucketName}/uploads/*
            - Sid: CreateUserCorpora
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:PutItem
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CorporaTableName}
            - Sid: ManageDocumentStatus
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DocumentStatusTableName}
            - Sid: DeleteDocumentChunks
              Effect: Allow
              Action:
                - dynamodb:BatchWriteItem
                - dynamodb:Query
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ChunksTableName}
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchAgentHttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        # Browser CORS preflight requests do not include a Cognito token.
        # Keep OPTIONS public; the actual API requests remain authenticated.
        OptionsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchAgentHttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchAgentHttpApi
            Path: /
            Method: ANY
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchAgentHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  DocumentIngestionFunctionName:
    Description: Worker to select for the existing bucket's uploads/ notification
    Value: !Ref DocumentIngestionFunction
  DocumentIngestionFailureQueueUrl:
    Description: Failed invocation records for inspection and manual replay
    Value: !Ref DocumentIngestionFailures
  DocumentStatusTableName:
    Description: Table tracking uploaded document processing
    Value: !Ref DocumentStatusTableName
  ApiUrl:
    Description: Public base URL for the research-agent HTTP API
    Value: !Sub https://${ResearchAgentHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Description: Lambda function name
    Value: !Ref ResearchAgentFunction
  UserPoolId:
    Description: Cognito user pool used to authenticate API users
    Value: !Ref ResearchAgentUserPool
  UserPoolClientId:
    Description: Cognito application client ID used by the frontend
    Value: !Ref ResearchAgentUserPoolClient
